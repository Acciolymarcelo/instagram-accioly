name: Publicador Accioly

# Publicar requer a variável explícita; preflight manual funciona antes da ativação.
on:
  schedule:
    # UTC: 12h, 16h and 20h in America/Sao_Paulo.
    - cron: '0 15,19,23 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Operação
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - publish-due

permissions:
  contents: write

concurrency:
  group: accioly-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight') || vars.ACCIOLY_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IG_LOGIN_MODE: unified
    steps:
      - name: Checkout da fila e do estado confirmado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: true

      - name: Validar configuração e proteger estado local
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_VERSION: v27.0
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          required = ('IG_ACCESS_TOKEN', 'IG_GRAPH_VERSION')
          if not all(os.environ.get(k) for k in required):
              raise SystemExit('A conexão Meta não está configurada; nenhuma publicação executada.')
          state = Path('runtime/state.json')
          state.parent.mkdir(mode=0o700, exist_ok=True)
          state.parent.chmod(0o700)
          if state.exists():
              if state.is_symlink():
                  raise SystemExit('Estado inválido.')
              state.chmod(0o600)
          PY

      - name: Conferência ao vivo ou publicação da peça devida
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_VERSION: v27.0
          ACCIOLY_STATE_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_OPERATION: ${{ inputs.operation || 'publish-due' }}
        run: |
          if [ "$PUBLISH_OPERATION" = preflight ]; then
            python3 publisher.py preflight --execute
          else
            python3 publisher.py run-due --execute \
              --max-lateness-seconds 900 --require-state-sync \
              --state-sync-command '["python3","scripts/sync_state.py","{state}"]'
          fi

      - name: Resultado da execução
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          state = Path('runtime/state.json')
          if not state.exists():
              print('Sem publicação confirmada nesta execução.')
          else:
              value = json.loads(state.read_text())
              for slug, item in value.get('pieces', {}).items():
                  print(slug, item.get('state', 'unknown'), item.get('media_id', ''))
          PY
