name: Verificar agendador Accioly

on:
  schedule:
    # 14h06, 14h11 e 14h16 de Brasília em 7 de novembro de 2026.
    - cron: '6,11,16 17 7 11 *'

permissions:
  contents: read

jobs:
  verificar:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirmar a data da verificação
        run: test "$(date -u +%F)" = '2026-11-07'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Consultar conta, cota e JPEGs
        env:
          IG_LOGIN_MODE: unified
          IG_GRAPH_VERSION: v27.0
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 -B publisher.py preflight --execute
